[project]
name = "ort-werkzeuge"
version = "1.0.0"
description = "Prüfungen für die Inhalte eines Ort-Repositorys (Saar LiDAR Explorer, Open-Kirrberg)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

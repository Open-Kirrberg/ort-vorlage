# Prüfungen bei jedem Pull Request (Plan „Orte skalieren“ §7): Schemas, Lizenzfeld, Bilder (Größe, EXIF),
# Datenschutz-Heuristiken (R7), keine Grabungs- oder Kampfmittel-Hinweise, keine genauen Koordinaten für neue
# Funde (R4, R5). Die CI filtert Routinefälle – eine Ortspatin oder ein Ortspate prüft trotzdem jeden Beitrag.
name: Prüfungen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inhalte:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: werkzeuge/uv.lock

      - name: Inhalte prüfen
        run: uv run --project werkzeuge --frozen python werkzeuge/ort_check.py .

      - name: Prüfskript testen
        working-directory: werkzeuge
        run: uv run --frozen pytest -q
